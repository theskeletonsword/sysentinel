#
# Workspace root for the sysentinel initramfs tools.
#
# Both binaries are statically built for x86_64-unknown-linux-musl so they
# run on a bare dracut ramdisk without shipping libc/deps:
#
#   - cam/  : sysentinel-cam  — V4L2 snapshot (libc + image only, tiny)
#   - face/ : sysentinel-face — tract-based face detector/embedder (ONNX
#             embedded into the binary via include_bytes!)
#
# The normal sysentinel daemon (daemon/) stays a glibc build — musl is only
# for the initramfs tools.

[workspace]
members = ["cam", "face"]
resolver = "2"

# Shared by both initramfs tools: small static binaries, abort on panic.
[profile.release]
opt-level = "z"
lto       = true
panic     = "abort"
strip     = true