# SPDX-License-Identifier: Apache-2.0
#
# sysentinel-daemon — example configuration file.
# Copy to /etc/sysentinel/config.toml (or pass --config PATH) and fill in
# your own values.  Keep it chmod 600:  sudo chmod 600 /etc/sysentinel/config.toml

# ── [general] ────────────────────────────────────────────────────────────────

[general]
# Minimum severity that triggers an alert:
#   "info" | "warning" | "error" | "critical"
min_severity     = "warning"
# Fallback sleep between /dev/kmsg reads (ms) when blocking mode is unavailable.
poll_interval_ms = 500
# Where the bot persists `/settings` notification preferences (JSON). Defaults
# to /var/lib/sysentinel/settings.json.
settings_file = "/var/lib/sysentinel/settings.json"
# How often the live watcher checks thermal / memory / load / PMU / TSC and
# reports the top processes (htop). Minimum effective value: 5 s.
watch_interval_secs = 15
# How often the LLM runs its own *proactive* review (only while the
# `proactive` category is ON in /settings): it looks at sensors + recent dmesg
# and decides on its own whether to tell you. Every run costs one small LLM call.
review_interval_secs = 300

# ── [settings] toggles lived in /settings (JSON, not this file) ───────────────
# The daemon persists on/off per-category to /var/lib/sysentinel/settings.json.
# Defaults (all ON unless noted): kernel, selinux, thermal, memory, load, htop,
# pmu, battery, tsc, control, login, hypercall, modwatch. Default OFF: diag, proactive.
#
#   login           — announce every login (GUI + SSH) and let you accept/kill it
#   login_timeout   — seconds to answer before auto-close (default 180; 0 = keep)
#   login_auto_close— on timeout with no answer: close (default true)
#   hypercall       — report what each guest asked the KVM hypervisor
#   modwatch        — notice/ask about foreign kernel modules being insmod'd
#   battery         — alert on laptop battery draining (≤20/10/5%); no-op on desktops
#
# Machine fingerprint (`/definehome`): saved to home.json next to settings_file.

# ── [persona] ────────────────────────────────────────────────────────────────

[persona]
# Free-text description of the AI's tone and persona. Injected verbatim into
# the system prompt. Write it however you like.
#
# Examples:
#   "formal and concise, like a seasoned systems administrator's incident report"
#   "colloquial Chilean Spanish, casual and direct, use local slang freely"
#   "flaite/callejero Chilean style — very informal, Ché wey energy"
#   "friendly senior DevOps engineer explaining things to a junior"
tone = "formal and concise, like a seasoned systems administrator's incident report"
# BCP-47 language tag. The AI will answer in this language regardless of tone.
language = "es-CL"
# Personify: the bot mirrors the machine's live mood (load, memory, temperature,
# PMU) on every turn — the "System mood" line. Cost: one short line
# per turn. Set false to disable.
emotions = true
# Whether the CPU is undervolted. RESOLVED AT RUNTIME by vendor (Intel/AMD/
# Zhaoxin): the persona only claims an undervolt/overvolt when positive evidence
# exists (intel-undervolt applied, or the intel-undervolt service enabled with
# non-zero offsets in /etc/intel-undervolt.conf). Otherwise it tells the truth
# (stock). This flag is used ONLY as an opt-in when the state is unverifiable.
# See /undervolt for the live check.
undervolted = false
# Rewrite every push notification (SELinux, thermal, RAM, load, PMU, TSC) in
# the persona's own dialect instead of cold log lines. If you set the bot to
# talk Chilean Spanish, the alerts will too. Costs one small LLM call per event.
chatty_alerts = true

# ── [memory] ─────────────────────────────────────────────────────────────────

[memory]
# Long-term memory file: facts the bot remembers forever. Edit it by hand to
# teach the bot permanent things about you / your machine. Injected into every
# conversation turn.
memory_file  = "/var/lib/sysentinel/memory.txt"

# Rolling conversation context (context window / conversation history). Each
# user+assistant turn is appended here automatically. Cleared with
# /resetcontext from the phone.
context_file = "/var/lib/sysentinel/context.txt"

# Max turns kept in context.txt before old ones are pruned (15 = 7.5 q/a pairs).
# Keep it small to limit input tokens (and cache-token spend) on paid LLM APIs
# like DeepSeek.
context_max_entries = 15

# ── Outbound TLS ─────────────────────────────────────────────────────────────
# LLM calls are the only thing this daemon still sends to somebody else's
# server, and they carry your API key in a header and, in the body, what just
# happened on this machine. Three things:
#
# 1. TLS 1.3 only. Not "1.3 preferred": offering 1.2 as well means the SERVER
#    chooses, and choosing is what a version floor takes away from the other
#    end. Every provider negotiates 1.3 — verified against Anthropic, OpenAI,
#    DeepSeek and Gemini. An endpoint that cannot is a TLS-intercepting proxy.
#
# 2. https:// is required on every base_url, at config load AND before each
#    request (a file can be edited after it was validated). An http:// used to
#    send the key in the clear with nothing to warn you. `llama` is exempt on
#    purpose: it is usually a llama.cpp on loopback, where nothing leaves.
#
# 3. tls_pins pins the server's PUBLIC KEY (SPKI), not the certificate.
#    Providers rotate certificates often while keeping the key, so pinning the
#    certificate breaks on a Tuesday for no security reason — and a pin that
#    breaks gets deleted, which is worse than not pinning at all.
#
#    It is additive: the chain is validated as usual and the pin is checked on
#    top. With no pins, ordinary HTTPS trusting the 100+ CAs in the store. With
#    pins, only the key you name. Optional, because a stale pin is an outage.
#
#    Get one like this:
#      openssl s_client -connect api.anthropic.com:443 </dev/null 2>/dev/null \
#        | openssl x509 -pubkey -noout | openssl pkey -pubin -outform der \
#        | openssl dgst -sha256 -binary | openssl enc -base64
#
# tls_pins = ["sha256/yzfNb1bRcNF+H1Fts441Vj0MIuuxepdWKmqKJ/bVV6U="]

# ── [llm] ───────────────────────────────────────────────────────────────────

[llm]
# Ordered fallback chain of LLM backends. Tried in order — if one fails (API
# error / timeout) the next one answers; "none" never fails and echoes raw
# text, so it is the natural last resort for graceful degradation.
#   "anthropic" | "openai" | "deepseek" | "gemini" | "llama" | "local" | "none"
# Both a single string and a list work here:
#   backend = "deepseek"
#   backend = ["deepseek", "llama", "local", "none"]
# NOTE: the paired user can change this LIVE and persisted:
#   `/llm <name>`            → switch to a single provider
#   `/settings backends a,b,c` → set the whole fallback chain
# Either wins over this setting until reset.
backend    = ["deepseek", "llama", "local", "none"]
# Model name passed to the API backends. Examples:
#   anthropic : "claude-opus-5"  or  "claude-sonnet-4-6"
#   openai    : "gpt-4o"
#   deepseek  : "deepseek-chat"
#   gemini    : "gemini-1.5-pro"
#   llama     : whichever GGUF the llama.cpp server is serving
model      = "deepseek-chat"
# Maximum tokens in the AI's reply. 512 is comfortable for most kernel events
# and the channel's message limit. Raise for more detailed answers.
max_tokens = 512
# Per-request timeout (seconds) for the HTTP backends. After this a backend is
# considered failed and the fallback chain moves to the next one.
timeout_secs = 60

[llm.openai]
api_key  = "REPLACE_WITH_YOUR_OPENAI_KEY"
base_url = "https://api.openai.com/v1"

[llm.anthropic]
api_key  = "REPLACE_WITH_YOUR_ANTHROPIC_KEY"
base_url = "https://api.anthropic.com/v1"

[llm.deepseek]
api_key  = "REPLACE_WITH_YOUR_DEEPSEEK_KEY"
base_url = "https://api.deepseek.com/v1"

[llm.gemini]
api_key  = "REPLACE_WITH_YOUR_GEMINI_KEY"
base_url = "https://generativelanguage.googleapis.com/v1beta"

[llm.llama]
# llama.cpp HTTP server (OpenAI-compatible). Spin it up with e.g.:
#   llama-server -m model.gguf -c 4096 --port 8080
# and point base_url at its /v1 endpoint. `api_key` is usually unused (any
# value works); keep it bare if your server needs no auth.
# The context length can be changed live without restarting the server:
#   /settings llama_ctx <tokens>   (send n_ctx ≤ the server's -c cap; 0 = default)
api_key  = ""
base_url = "http://127.0.0.1:8080/v1"

[llm.local]
# Path to a local .gguf model file — OR a directory of models scanned
# recursively (vision *mmproj*.gguf and MTP mtp-*.gguf companions attach to
# their base model automatically; see `/models`).
model_path   = "/opt/sysentinel/models/"
# mmproj_path = ""   # optional explicit projector; auto-resolved if unset
# mtp_path    = ""   # optional explicit MTP companion; auto-resolved if unset
context_size = 2048

# ── [hwdiag] ─────────────────────────────────────────────────────────────────

[hwdiag]
# Enable periodic hardware diagnostics summaries pushed to the phone.
enabled          = false
# How often to send diagnostics, in minutes.
interval_minutes = 60
# Include Intel ME / AMD PSP firmware status in the summary.
include_firmware = true

# ── [pmu] ────────────────────────────────────────────────────────────────────

[pmu]
# Include PMU (Performance Monitoring Unit) counters in:
#   - The system context sent to the LLM when you ask a question.
#   - The /status command.
#   - Periodic hwdiag summaries.
#
# Software counters (context switches, page faults, CPU migrations) are always
# available. For hardware counters the daemon walks a ladder and keeps the
# widest scope /proc/sys/kernel/perf_event_paranoid actually permits — it never
# just gives up:
#
#   paranoid  what you get
#   -------- -----------------------------------------------------------------
#     <= 0    system-wide: every CPU, kernel time included
#        1    this process only, kernel time included
#        2    this process only, user-mode only  <- the UPSTREAM DEFAULT
#     >= 3    nothing (a Debian/Ubuntu-only setting)
#
# CAP_PERFMON bypasses all of it. To get machine-wide counters, either:
#   - AmbientCapabilities=CAP_PERFMON in the systemd unit (preferred), OR
#   - echo 0 | sudo tee /proc/sys/kernel/perf_event_paranoid
#
# It matters on a hybrid CPU (Intel P/E cores, ARM big.LITTLE): the per-core-type
# breakdown is sharpest system-wide, where each CPU gets its own counter and the
# results are grouped by the core type the silicon itself reports.
#
# The daemon degrades gracefully at every rung, and says which one it used.
enabled   = true
# How long to sample PMU counters before reading them, in milliseconds.
# 250 ms is a good balance; raise to 1000 ms for more accurate IPC measurement.
sample_ms = 250

# ── [camera] ─────────────────────────────────────────────────────────────────
# Intrusion webcam: photos of whoever is at the keyboard, attached to the
# outgoing alerts. Three triggers:
#   - LUKS decrypt (photo taken by the initramfs hook BEFORE login; daemon
#     finds it here and asks "was that me?")
#   - a successful login
#   - ≥ login_fail_threshold failed login attempts in a row
# With no webcam, only the text alert is sent.

[camera]
# Off by default: no /dev/video* is ever touched until you enable this.
enabled = true
# The V4L2 binary (built from ramdisk/, installed by scripts/install-dracut.sh).
# It auto-detects BOTH USB webcams and the built-in one.
tool_path = "/usr/libexec/sysentinel-cam"
# Where the initramfs hook mirrors the LUKS evidence (marker + photo). The
# capture now starts BEFORE the LUKS password prompt; the pre-pivot hook is
# only the fallback. The daemon scans this dir at startup and dedupes by
# kernel boot_id.
evidence_dir = "/var/lib/sysentinel/luks-evidence"
# Failed attempts before an intruder photo + alert (3 guesses = brute-force).
login_fail_threshold = 3
# Keep counting failures within this many minutes before a burst re-arms.
fail_window_minutes = 10
# Requested capture resolution; the camera picks the nearest supported one.
width  = 640
height = 480

# ── [face] ──────────────────────────────────────────────────────────────────
# Local owner-face verification at login. Purely perceptual: every photo is
# reduced to two 64-bit hashes (pHash/DCT + wHash/Haar) and matched by
# Hamming distance — NO neural model, NO LLM tokens, and NO pictures are ever
# stored. `/face register` is the only way to enroll your face; when enabled,
# a login whose webcam frame does NOT match a registered hash is flagged.
#
# threshold meaning (distance over 64 bits):
#   ≤ *owner        → it's the owner
#   ≤ *ambiguous    → possible owner, keep an eye
#   >  *ambiguous   → unknown face (potential intruder)
# The match is an OR-vote: pHash *or* wHash under its owner threshold is
# enough (each hash survives different degradations).

[face]
# Recognize the owner by camera at login (default: off — no camera use).
enabled = false
# Where the owner-face hashes live (JSON, mode 0600). Hashes only.
path = "/var/lib/sysentinel/faces.json"
# ── Which engine decides a login ─────────────────────────────────────────────
# When `tool_path` exists AND an enroll carries a 128-D vector, the verdict is
# the NEURAL one: SCRFD detects the face, MobileFaceNet embeds the aligned
# 112x112 crop, and the probe is compared by cosine. The same static-musl
# binary the initramfs uses runs here — one artifact, so early boot and the
# live daemon can never disagree about what a face is.
#
# Without it the daemon falls back to the 64-bit perceptual hashes below. That
# fallback is weaker in a way worth understanding: a perceptual hash describes
# the whole PICTURE, background included, not the face. A different person in
# your chair, against your wall, at your framing scores close to you — which is
# precisely the case this daemon exists to catch. `/face status` always says
# which engine is live.
tool_path = "/usr/libexec/sysentinel-face"

# ── What each composition of the frame means ─────────────────────────────────
# The neural engine does not count faces, it classifies the scene — because
# what decides the right answer is not how many there are, but WHO is missing:
#
#   owner alone ................. normal, nothing to do
#   owner + strangers ........... POSSIBLE COERCION. Somebody is reading over
#                                 the shoulder, or is there to make sure you log
#                                 in. The alert goes to the chat and NO local
#                                 action is taken: if you are being coerced, a
#                                 machine that switches itself off announces
#                                 that it informed on you, and you are the one
#                                 who pays for that.
#   1 stranger, no owner ........ opportunistic access to an unattended machine
#   2+ strangers, no owner ...... CUSTODY LOST. People do not gather around
#                                 somebody else's laptop by accident: two of
#                                 them is the signature of a procedure (a search
#                                 or a seizure brings a witness as a matter of
#                                 policy), of a theft being examined, or of
#                                 somebody at home showing your machine off.
#                                 Loud alert, and still destroys nothing on its
#                                 own.
#   no faces .................... an empty chair is NOT an intruder
#
# Faces much smaller than the largest are discarded as a portrait, a screen or
# the background (threshold: 10% of the area). Without that filter, a poster
# behind the desk would fire the coercion alert daily, and a daily alert is one
# nobody reads.

# Cosine thresholds over the 128-D embeddings (1.0 = identical, 0.0 = unrelated).
# Measured on these models: the same image scores 1.000000, while six different
# faces scored -0.03, 0.0005, 0.069, 0.10, 0.10 and 0.46. That 0.46 is why the
# floor sits above the 0.45 often quoted for MobileFaceNet — a stranger already
# reached it. Enroll a few times and see where your own repeat photos land
# before loosening these.
nn_owner     = 0.62   # >= this: it's you
nn_ambiguous = 0.50   # >= this: possibly you, worth a look

# Hamming thresholds for the perceptual-hash fallback (64-bit hashes).
p_owner      = 14
w_owner      = 15
p_ambiguous  = 20
w_ambiguous  = 22
# Seconds to wait for a frame while a format is being tried.
timeout = 10

# ── About the channels ───────────────────────────────────────────────────────
# Before switching a channel off: check that you still have ANOTHER one. A
# watchdog with no way to speak is not a hardened system, it is one that
# observes and can never say so. The daemon warns in the log when it goes deaf,
# and also says what each live channel exposes.
#
# The destination is the phone app, which can hold a key this machine cannot
# reach and needs no third party to deliver a message.

# ── [phone] ─────────────────────────────────────────────────────────────────
# The only channel: the phone app, connected directly to this machine.
#
# What it buys: no bearer token that speaks as the machine if it leaks, no
# endpoint a stranger reaches (and is rejected only AFTER arriving), and no
# third party that sees who talked to whom and when.
#
# HOW IT IS ENCRYPTED (so you do not have to take my word for it)
#   TLS 1.3 and nothing older, with `rustls` on this end and the Android stack
#   on the other. There is no CA: the machine signs its own certificate and the
#   QR carries the SHA-256 of its public key, so the phone accepts THAT key and
#   no other. No public CA will ever certify a LAN address, and a fingerprint
#   handed over by hand is a better introduction than a name signed by one of
#   the hundred authorities in the system store.
#
#   Inside that tunnel every frame is sealed with AES-256-GCM under the pairing
#   key. That is not redundant: TLS proves the MACHINE is your machine, the seal
#   proves the caller holds the key, and the phone's signature — one layer up —
#   proves it is THAT handset.
#
#   What the TLS buys that was missing before: forward secrecy. A pairing key
#   that leaked LATER used to decrypt everything ever recorded. Not any more:
#   each session negotiates ephemeral keys and takes them with it.
#
#   The certificate lives in /var/lib/sysentinel/phone-cert.der (its private
#   half in phone-key.der, 0600). Delete them and the machine mints new ones,
#   and you have to scan the QR again — the phone refuses a key that is not the
#   one it wrote down, which is exactly what it should do.
#
#
# HOW IT IS PAIRED (once, at home)
#   1. Put the phone on the SAME WIFI as the PC.
#   2. `bind` = this PC's address on that network, with a port:
#      "192.168.1.5:8443" (find it with `ip -4 addr` or `hostname -I`).
#   3. Start the daemon: it draws a QR on the console. Scan it with the app.
#   4. The app generates a key INSIDE the phone's TEE (StrongBox/Titan where the
#      model has one) and registers it. Done.
#
# From then on the link is between THIS machine and THAT phone. It does not
# expire, it does not need repeating, and it does not depend on the network: on
# the sofa, in Italy, in Spain or on Mars, you are talking to your PC. The only
# thing needed is for the phone to be able to REACH the machine — and that is
# routing, not pairing.
#
#
# HOW IT IS REACHED FROM OUTSIDE (pick one)
#   a) SAME NETWORK (home, office): nothing to do. It just works.
#
#   b) VPN — Tailscale or WireGuard. THIS IS THE GOOD ONE, and not out of
#      purism: the VPN address is THE SAME at home and from Mars. Put `bind` on
#      that address and the QR you scanned on the sofa still works from another
#      continent, without touching anything. The port is also not exposed to the
#      internet: it only exists inside your private network, so internet-wide
#      scans never see it. And it works under CGNAT, like the tunnel, because
#      the connection goes out from here too.
#
#      With Tailscale, in full:
#
#        # on the PC and on the phone (Tailscale app), with the SAME account:
#        sudo tailscale up
#        tailscale ip -4            # => 100.101.102.103  ← this goes in bind
#
#        bind = "100.101.102.103:8443"
#
#      With MagicDNS you can put the name in `advertise` if you prefer reading
#      it ("my-pc.tailnet-1234.ts.net:8443"); `bind` stays the IP, which is what
#      this machine actually has. Full guide: tutorial-tailscale.md.
#
#      Startup: the 100.x does not exist until tailscaled is up, so the daemon
#      waits up to a minute for it to appear before giving up (and the unit
#      already orders itself after tailscaled.service). If you see it complain
#      that the address does not exist, that is this.
#
#      What it costs, because it has a cost too: Tailscale coordinates keys
#      through a server of theirs. The traffic does NOT go through it (it is
#      WireGuard point to point, and where there is no direct route the DERP
#      relay only sees ciphertext), but that server knows which machines you
#      have, what they are called and when they connect. If that is too much,
#      plain WireGuard has no coordinator, and Headscale is Tailscale's control
#      plane run at home.
#
#   c) Port forward on the router + DDNS. Works perfectly and depends on nobody:
#      your router, your name, your house. This is what to set up:
#
#        - On the router: forward an external port to this machine. The external
#          one does NOT have to match the internal one; if you change it, the
#          one that goes in `advertise` is the EXTERNAL one.
#            TCP  45678  ->  192.168.1.5:8443
#        - DDNS (the router's own, or duckdns/no-ip/desec/Cloudflare) so you do
#          not have to chase the address every time the ISP changes it.
#        - Here:
#            bind      = "192.168.1.5:8443"        # the local interface
#            advertise = "home.duckdns.org:45678"  # what goes in the QR
#
#      `bind` NEVER holds the DDNS name or the public address: that is not an
#      address of this machine and the daemon will not start (and says so).
#
#      Two things that bite, and neither is your fault:
#
#        - HAIRPIN NAT. Plenty of routers will not let an inside host leave to
#          the public address and come back. So: it works from the street and
#          fails AT HOME, which is where you will test it first. If that happens
#          nothing is broken: use the LAN address at home and the DDNS one away
#          (change it in the app, tap `machine: …`), or look for "NAT
#          loopback"/"hairpin" in the router and turn it on.
#        - CGNAT. If your ISP gives you a shared address (check whether the
#          router's WAN is 10.x / 100.64-127.x / 192.168.x), there is no port to
#          forward because the public address is not yours. Then it is (b) or
#          (d).
#
#      What it costs: it leaves that port visible to the whole internet. They do
#      not get in (without the key AND the registered handset's signature they
#      do not get past the first frame), but they will knock — automated scans,
#      all day — and you are betting that parsing that first frame has no bug. A
#      high, odd port is not security, but it does keep the noise of scans
#      against the usual ports off you.
#
#   d) A tunnel — ngrok / Cloudflare / an SSH forward. Works, and it is the way
#      out when you cannot touch the router or you are behind CGNAT: the tunnel
#      goes out FROM here, so nothing needs opening.
#
#      It has to be a TCP tunnel, not HTTP: this does not speak HTTP.
#
#        ngrok tcp 8443          # => tcp://0.tcp.ngrok.io:19876
#        bind      = "127.0.0.1:8443"        # the tunnel is what faces the world
#        advertise = "0.tcp.ngrok.io:19876"  # this is what goes in the QR
#
#      What ngrok does NOT see: anything you say. Every frame is AEAD-sealed
#      under the pairing key and it only forwards opaque bytes — unlike the chat
#      bot that was removed, where the third party read the content. What it DOES
#      see: that this machine has a tunnel open, when your phone connects, and
#      how much traffic there is. On a watchdog that pattern is already
#      information: "the machine talked to its owner at 03:14" is exactly what
#      produces an alarm.
#
#      The rest of what it costs, without dressing it up:
#        - There is a bearer token on this machine again (ngrok's authtoken),
#          which is the class of thing this design was getting away from.
#        - The endpoint is public: anyone can dial that host:port. They do not
#          get in — without the key and the registered handset's signature they
#          stop at the first frame — but strangers knock on the door.
#        - On the free tier the address CHANGES every time you restart the
#          tunnel, so the QR and whatever the app saved go stale and the address
#          has to be corrected by hand each time. A fixed address is paid.
#        - It depends on a third party staying up and not rate-limiting you.
#
#      That is why it is fourth and not first: Tailscale solves the SAME CGNAT
#      problem (no ports opened, going out from here), gives you a stable
#      address, and publishes no endpoint at all. Use (d) if you cannot install
#      (b), or for something one-off.
#
# And if you already paired with the home address and then travel? No need to
# pair again: the host and port are editable in the app. The key and the phone's
# identity still hold — what changes is where it dials.
#
# And if at some point there is no route at all (a plane, no data, the VPN
# down): alerts are written to disk BEFORE any attempt to deliver them and are
# only removed once the phone acknowledges them. "Nobody was listening" delays
# an alert, it does not destroy it: they arrive whole when you reconnect.
#
# Note: this does make a privileged daemon listen on a socket. That is a surface
# that did not exist before. Which is why it is off, and why `bind` has no
# default: deciding which interface it is reachable from IS the decision, and it
# is made by hand.

[phone]
enabled = false
# bind: the address the PHONE sees you on, not "where do I listen".
# Do not use 0.0.0.0: the QR carries that string verbatim and the phone would
# not know where to dial. The daemon warns you if it spots one.
#   LAN:        bind = "192.168.1.5:8443"
#   Tailscale:  bind = "100.101.102.103:8443"   ← the same from any country
# bind = "192.168.1.5:8443"
#
# advertise: only when the QR has to say something DIFFERENT from `bind`. That
# is the tunnel case: you listen on loopback and the tunnel is what faces the
# world, so the address the phone dials is not one of this machine's. Unset, the
# QR carries `bind` verbatim (which is right on a LAN and on a VPN). The daemon
# warns when the address going into the QR is a wildcard (0.0.0.0) or loopback,
# because from the phone neither is anywhere.
# advertise = "0.tcp.ngrok.io:19876"
#
# pairing_key: start without one and the daemon generates it for you.
# pairing_key = "…64 hex…"
#
# PAIRING: with no phone registered, the daemon draws the QR on the console at
# startup. `/pair` shows it again (on the machine's console, never over the
# channel: sending the key through the channel that key opens would be exactly
# backwards).
#
# Whoever sees that screen can read the key. That is why it stops being enough
# the moment a handset is registered: from then on the machine also demands a
# signature from THAT phone, and refuses any other — even the same model.
queue_capacity = 500
queue_path = "/var/lib/sysentinel/phone-queue.json"

# ── [ipc] ────────────────────────────────────────────────────────────────────
# Local control socket for the desktop GUI, so you don't have to type into a
# chat window in front of colleagues.
#
# IT NEVER NOTIFIES. This socket answers questions and volunteers nothing: no
# desktop notifications, no popups, no sound. That is a security property, not
# an omission — if someone is standing over you, a machine that pops
# "ROSTRO NO REGISTRADO" onto the screen has announced that it informed on you,
# and you are the one who pays for it. Alerts stay on the phone channel, where
# only your handset sees them. The GUI is somewhere you go and look, on purpose.
#
# The daemon behind this socket runs as root, so the socket's permissions ARE
# the access control. Left alone it is 0600 root-only; naming a group hands it
# to that group at 0660. Destructive operations still require the
# ARM -> CONFIRM ritual: a local front-end is a convenience, not a proof of
# identity.

[ipc]
enabled = false
# group = "sysentinel"
