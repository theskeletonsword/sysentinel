#
# DKMS manifest for sysentinel_metrics.
#
# Installed with the source, so `dkms install` keeps its own copy under
# /usr/src/sysentinel_metrics-<version>/. That copy is the point: the git
# checkout can be deleted, moved or lost and the module can still be rebuilt
# for the next kernel from what DKMS holds.
#
# AUTOINSTALL=yes makes the kernel-install hook attempt a rebuild whenever a
# new kernel lands. For a rust-for-linux module that attempt needs a prepared
# kernel tree and a matching rustc; build-module.sh checks for both and fails
# with instructions rather than installing something that cannot load. A
# failed DKMS autoinstall is loud and harmless — the old kernel still boots.

PACKAGE_NAME="sysentinel_metrics"
PACKAGE_VERSION="0.1.0"

# Everything goes through the wrapper: it resolves the kernel tree and the
# exact rustc, and refuses the build when either is missing. See the long
# comment at the top of build-module.sh for why a plain `make` cannot work here.
#
# No CLEAN=: dkms 3.x deprecated it and warns on every single operation. It
# builds in its own tree under /var/lib/dkms and discards it afterwards, so
# there was nothing for a clean hook to do anyway. `build-module.sh clean` still
# exists for running by hand.
MAKE[0]="./build-module.sh build ${kernelver}"

BUILT_MODULE_NAME[0]="sysentinel_metrics"
DEST_MODULE_LOCATION[0]="/extra"

AUTOINSTALL="yes"

# The module taints the kernel (out-of-tree, and unsigned unless you enrol a
# MOK). Signing is deliberately left to the operator: a key generated by a
# build script and left on the same disk is a ceremony, not a guarantee.
