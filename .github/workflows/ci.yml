# SPDX-License-Identifier: Apache-2.0
#
# Build, lint and test the two Rust workspaces on every push and PR.
#
# Deliberately NOT running `cargo fmt --check`: this codebase uses hand-aligned
# columns that rustfmt would rewrite. Style is reviewed by humans; clippy is
# the machine-enforced gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    name: daemon (ring 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: clippy
        run: cargo clippy --manifest-path daemon/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path daemon/Cargo.toml
      - name: build (release)
        run: cargo build --manifest-path daemon/Cargo.toml --release

  ramdisk:
    name: ramdisk tools (musl static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ramdisk
      - name: clippy
        run: cargo clippy --manifest-path ramdisk/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path ramdisk/Cargo.toml
      # The initramfs tools must stay statically linked: a dynamic binary would
      # fail to run on a bare dracut ramdisk.
      - name: build (musl static)
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --manifest-path ramdisk/Cargo.toml \
            --release --target x86_64-unknown-linux-musl
          for b in sysentinel-cam sysentinel-face; do
            path=ramdisk/target/x86_64-unknown-linux-musl/release/$b
            file "$path"
            # musl produces a static-PIE; accept either wording, reject dynamic.
            file "$path" | grep -qE 'static-pie linked|statically linked' \
              || { echo "::error::$b is not statically linked"; exit 1; }
          done

  gui:
    name: GTK4 front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/linux
      - name: gtk4 development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: clippy
        run: cargo clippy --manifest-path gui/linux/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path gui/linux/Cargo.toml
      - name: build (release)
        run: cargo build --manifest-path gui/linux/Cargo.toml --release

  apk:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      # Release builds come out unsigned here, on purpose: CI checks that a
      # release build compiles and that R8 does not strip anything, without
      # ever holding the signing key.
      - name: assemble
        run: |
          cd gui/android
          gradle assembleDebug assembleRelease
      # R8 cannot see a crypto provider name reach a class, so a missing keep
      # rule builds cleanly and fails on the first frame at runtime. Check the
      # strings survived instead of finding out on a handset.
      - name: crypto strings survived minification
        run: |
          cd gui/android
          for f in app/build/outputs/apk/*/release/*.apk; do
            for s in "AES/GCM/NoPadding" "SHA256withECDSA" "AndroidKeyStore"; do
              unzip -p "$f" classes.dex | strings | grep -qF "$s" \
                || { echo "::error::$s stripped from $f"; exit 1; }
            done
          done
          echo "crypto entry points intact in every release APK"

  interop:
    name: phone frame interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The daemon seals a frame and the JVM opens it, and vice versa. A
      # mismatched tag length or nonce convention would otherwise give two
      # halves that each pass their own tests and never interoperate.
      - name: rust <-> jvm frames
        run: ./scripts/phone-interop-check.sh

  licences:
    name: licence map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repo is deliberately not uniformly licensed: daemon/ is Apache-2.0
      # while kernel_module/, ramdisk/ and scripts/ are MIT OR GPL-2.0-or-later.
      # A new file with the wrong header quietly breaks that, so gate on it.
      - name: per-directory licence map
        run: ./scripts/licence-map-check.sh

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning $(git ls-files '*.sh')
